{{- if (include "questarr.hasInlineSecrets" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "questarr.fullname" . }}
  labels:
    {{- include "questarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $keys := .Values.questarr.existingSecretKeys }}
  {{- range $name, $value := .Values.questarr.secrets }}
  {{- if $value }}
  {{- $key := index $keys $name }}
  {{- if not $key }}
  {{- fail (printf "questarr.existingSecretKeys is missing an entry for %q" $name) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
