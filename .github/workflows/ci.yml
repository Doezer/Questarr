name: CI

on:
  push:
    branches: [main, release/*]
    # Docs-only changes skip CI. Secrets in docs are still caught by Semgrep's
    # p/secrets ruleset (sast.yml), which runs on every change.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, release/*]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # Allow manual trigger
  workflow_dispatch:

# Only the newest commit of a PR or branch is worth testing: a new push cancels the
# run still going for the previous one, so bursts of pushes don't queue up runners
# (the account shares a fixed number of concurrent jobs across all its repositories).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dependency and secret hygiene, in one job so `npm ci` runs once instead of three times.
  # None of these steps needs native modules built, so lifecycle scripts (arbitrary code
  # from transitive deps) are skipped.
  sca-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.docker-changes.outputs.docker }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      # secretlint requires Node >=22
      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          # GitHub scopes the Actions cache per-branch (a pull_request run cannot write
          # into the cache that push/main runs restore from), and every `npm ci` in this
          # workflow runs with --ignore-scripts, so a compromised dependency cannot run
          # install/postinstall code to tamper with the cache before it's saved. This repo
          # has a single maintainer with push access, so cache-poisoning here is accepted
          # as a low, non-actionable risk instead of splitting cache restore/save by trust.
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan for secrets
        run: npm run secretlint

      # Fails if a package.json "overrides" entry (see docs/DEPENDENCIES.md) has become
      # redundant, i.e. every consumer now declares a range that's already safe on its own.
      - name: Check for stale dependency overrides
        run: npm run check:overrides

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — Critical/High findings
      # in production dependencies block merge/release.
      - name: Audit production dependencies (Critical/High blocks build)
        run: node scripts/audit-prod.mjs --audit-level=high

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.4 — production dependency
      # licenses must be on the allow-list.
      # @lizenz/checker is a pinned devDependency (see package.json), installed above by
      # `npm ci` — --no-install below guarantees this never installs anything ad-hoc.
      - name: Check dependency licenses
        run: |
          npx --no-install license-checker --production --summary \
            --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;0BSD;Python-2.0;BlueOak-1.0.0;OFL-1.1;Unlicense;GPL-3.0;GPL-3.0-only;LGPL-2.1;LGPL-2.1-only;LGPL-3.0;LGPL-3.0-only;MPL-2.0"

      # docker-build takes ~4 minutes. Pushes to main/release always run it; a PR only
      # does when it touches something that can change the image beyond what `build`
      # already checks (Dockerfile, dependencies, files copied into the image).
      - name: Detect changes that affect the Docker image
        id: docker-changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files API lists at most 3,000 files; build when the PR is bigger or when
          # either call fails, rather than failing this job or skipping the image.
          count=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files') || count=""
          if [ -z "$count" ] || [ "$count" -gt 3000 ] \
            || ! changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|entrypoint\.sh|package(-lock)?\.json|requirements/|migrations(-pg)?/|\.github/workflows/ci\.yml$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  # One job for the whole suite (~3 min on a standard runner): four shards plus a merge
  # job cost five runners and five `npm ci` for about the same wall time, and runners are
  # what the account runs out of when several PRs are pushed at once.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backlog roulette CLI tests
        run: node --test scripts/__tests__/backlog-roulette.node.mjs

      # Coverage thresholds come from vitest.config.ts and fail the step when missed.
      - name: Tests
        run: |
          npm test -- --coverage \
            --reporter=default --reporter=junit --outputFile.junit=test-report.junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          report_type: coverage
          skip_validation: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          skip_validation: true

  build:
    runs-on: ubuntu-latest

    # PRs build on the minimum supported Node only (tests already run on 26.x);
    # pushes to main/release also build on 26.x.
    strategy:
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22.19.0"]' || '["22.19.0", "26.x"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # zizmor: ignore[cache-poisoning]

      # Lint/type-check/bundle never execute application code, so native module
      # build scripts (e.g. better-sqlite3) aren't needed here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "Build successful - dist directory created"

  docker-build:
    runs-on: ubuntu-latest
    needs: [sca-scan, build, test]
    if: needs.sca-scan.outputs.docker == 'true'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            www.rarlab.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Pre-pull BuildKit image
        run: |
          for i in {1..5}; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Pull failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0
      - name: Build Docker image
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          push: false
          tags: questarr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify Docker image
        run: |
          echo "Docker image built successfully"
          docker images | grep questarr || echo "Image not found in docker images, but build completed"
