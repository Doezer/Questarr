name: Deploy Web App

on:
  # Allow manual trigger for on-demand deployment
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "test"
        type: choice
        options:
          - production
          - dev
          - test
      tag:
        description: "Docker image tag (leave empty for auto-generated tag)"
        required: false
        default: ""
      build_arm64:
        description: "Also build ARM64 (slows down build; always on for production)"
        required: false
        default: false
        type: boolean
      build_windows_installer:
        description: "Also build the Windows installer (.exe, optional extra build)"
        required: false
        default: false
        type: boolean
      comment-id: # ← passed automatically by slash-command-dispatch
        required: false
      repository: # ← also passed automatically
        required: false

  # Run daily at midnight from the default branch (main) for dev builds
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — no release may ship with
  # an unresolved Critical/High SCA finding. Runs again here (not just in
  # ci.yml) so a fresh advisory published after `main` was merged still
  # blocks the release.
  sca-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: "npm"

      # This job only audits the dependency tree and checks licenses; it never
      # executes application code, so native module build scripts aren't needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies (Critical/High blocks release)
        run: npm audit --omit=dev --audit-level=high

      # @lizenz/checker is a pinned devDependency (see package.json), installed above by
      # `npm ci` — --no-install below guarantees this never installs anything ad-hoc.
      - name: Check dependency licenses
        run: |
          npx --no-install license-checker --production --summary \
            --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;0BSD;Python-2.0;BlueOak-1.0.0;OFL-1.1;Unlicense;GPL-3.0;GPL-3.0-only;LGPL-2.1;LGPL-2.1-only;LGPL-3.0;LGPL-3.0-only;MPL-2.0"

  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'schedule' && 'dev' || inputs.environment || 'dev' }}
    needs: sca-gate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Environment
        id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" == "schedule" ]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=${INPUT_ENVIRONMENT:-dev}" >> $GITHUB_ENV
            echo "environment=${INPUT_ENVIRONMENT:-dev}" >> $GITHUB_OUTPUT
          fi

          # Normalize repository name to lowercase and strip owner for Docker Hub
          REPO_NAME="$REPOSITORY"
          # Get the part after the slash (repo name only)
          REPO_SHOULD_BE_NAME="${REPO_NAME##*/}"
          # Lowercase
          REPO_NAME_LC=$(echo "$REPO_SHOULD_BE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "REPO_NAME_LC=$REPO_NAME_LC" >> $GITHUB_ENV

          # Full owner/repo, lowercased (GHCR requires lowercase image references)
          REPO_LC=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LC=$REPO_LC" >> $GITHUB_ENV

      # Single source of truth for whether this run builds ARM64, so the
      # "Set up QEMU" condition below and the `platforms:` expression in the
      # build step can't drift out of sync with each other.
      - name: Determine ARM64 build
        id: arch
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          BUILD_ARM64: ${{ inputs.build_arm64 }}
        run: |
          if [ "$ENVIRONMENT" == "production" ] || [ "$BUILD_ARM64" == "true" ]; then
            echo "multiarch_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "multiarch_enabled=false" >> $GITHUB_OUTPUT
          fi

      # Production always builds ARM64 so that published release images run
      # on Raspberry Pi and other ARM SBCs/NAS boxes; see the
      # "Determine ARM64 build" step above for the shared predicate.
      - name: Set up QEMU
        if: steps.arch.outputs.multiarch_enabled == 'true'
        uses: step-security/setup-qemu-action@1d653f731ddc90c553742100d15205c94b792314 # v4.2.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@a4709e2865773e1792246433e8eb922f9743a875 # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@bd6978fd4ef9a5f78130095b298b8a721afcb0d8 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: step-security/docker-login-action@bd6978fd4ef9a5f78130095b298b8a721afcb0d8 # v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository }}
            doezer/${{ env.REPO_NAME_LC }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ env.ENVIRONMENT == 'production' }}
            type=raw,value=dev,enable=${{ env.ENVIRONMENT == 'dev' }}
            type=sha,prefix=${{ env.ENVIRONMENT }}-sha-,format=short,enable=${{ env.ENVIRONMENT != 'dev' }}
          labels: |
            org.opencontainers.image.title=Questarr
            org.opencontainers.image.description=Questarr is an *Arr-inspired game manager that helps you discover, track, and automatically download the games you want.
            org.opencontainers.image.vendor=Doezer

      - name: Build and push Docker image
        id: build
        uses: step-security/docker-build-push-action@144392094f7fc3199dda455efe3b70dbea4b72a0 # v7.3.0
        with:
          context: .
          # Production is always multi-arch; dev/test stay amd64-only (and fast)
          # unless build_arm64 is explicitly requested. See the shared
          # "Determine ARM64 build" step above.
          platforms: ${{ steps.arch.outputs.multiarch_enabled == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          sbom: true

      - name: Prune stale test-sha GHCR tags (keep 15 days)
        if: github.event_name == 'schedule' && env.ENVIRONMENT == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ env.REPO_NAME_LC }}
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d '15 days ago' +%s)
          deleted_count=0

          if gh api "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=1" >/dev/null 2>&1; then
            package_api="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}"
          else
            package_api="/users/${OWNER}/packages/container/${PACKAGE_NAME}"
          fi

          # Every non-dev test build adds a `test-sha-<hash>` tag that never
          # goes untagged, so the digest-based prune below never reclaims it -
          # left alone, this list grows forever. Only delete a version here if
          # ALL of its current tags match that auto-generated pattern; a
          # version that also carries "latest", a `production-sha-*` tag, or
          # any human-chosen tag (a release like v1.3.0, a custom
          # workflow_dispatch tag like test-xxx, ...) is always kept.
          while IFS=$'\t' read -r version_id created_at tags_json; do
            all_auto=true
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              if ! [[ "$t" =~ ^test-sha-[0-9a-f]+$ ]]; then
                all_auto=false
                break
              fi
            done < <(jq -r '.[]' <<< "${tags_json}")

            if [ "${all_auto}" != true ]; then
              continue
            fi

            created_epoch=$(date -u -d "${created_at}" +%s)
            if [ "${created_epoch}" -lt "${cutoff_epoch}" ]; then
              echo "Deleting stale test-sha version ${version_id} (${created_at}, tags: ${tags_json})"
              gh api -X DELETE "${package_api}/versions/${version_id}"
              deleted_count=$((deleted_count + 1))
            fi
          done < <(
            gh api --paginate "${package_api}/versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | length > 0) | "\(.id)\t\(.created_at)\t\(.metadata.container.tags | tojson)"'
          )

          echo "Pruned ${deleted_count} stale test-sha GHCR tag(s)."

      - name: Prune old GHCR package versions (keep 15 days)
        if: github.event_name == 'schedule' && env.ENVIRONMENT == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ env.REPO_NAME_LC }}
          REPO_LC: ${{ env.REPO_LC }}
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d '15 days ago' +%s)
          deleted_count=0

          if gh api "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=1" >/dev/null 2>&1; then
            package_api="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}"
          else
            package_api="/users/${OWNER}/packages/container/${PACKAGE_NAME}"
          fi

          # Because the build enables `sbom: true`, buildx pushes every tag
          # (even single-platform ones) as an OCI index containing the image
          # manifest plus an attestation manifest. Only the index carries a
          # tag - its children show up here as "untagged" versions even
          # though a live tag still points at them. Deleting those once they
          # age past the cutoff leaves the tag's index referencing content
          # that no longer exists, breaking `docker pull` with a
          # "manifest ... not found" error. Build the set of digests
          # referenced by any currently tagged manifest and never delete
          # those, regardless of age.
          echo "Collecting digests referenced by tagged manifests..."
          referenced_digests=$(mktemp)
          tagged_names=$(gh api --paginate "${package_api}/versions?per_page=100" \
            --jq '.[] | (.metadata.container.tags // [])[]' | sort -u)

          for tag in ${tagged_names}; do
            docker buildx imagetools inspect "ghcr.io/${REPO_LC}:${tag}" --raw \
              | jq -r '.manifests[]?.digest // empty' >> "${referenced_digests}"
          done
          sort -u -o "${referenced_digests}" "${referenced_digests}"

          while IFS=$'\t' read -r version_id created_at digest; do
            if grep -qxF "${digest}" "${referenced_digests}"; then
              echo "Skipping ${digest} (still referenced by a tagged manifest)"
              continue
            fi
            created_epoch=$(date -u -d "${created_at}" +%s)
            if [ "${created_epoch}" -lt "${cutoff_epoch}" ]; then
              echo "Deleting untagged version ${version_id} (${created_at})"
              gh api -X DELETE "${package_api}/versions/${version_id}"
              deleted_count=$((deleted_count + 1))
            fi
          done < <(
            gh api --paginate "${package_api}/versions?per_page=100" \
              --jq '.[] | select(((.metadata.container.tags // []) | length) == 0) | "\(.id)\t\(.created_at)\t\(.name)"'
          )

          rm -f "${referenced_digests}"
          echo "Pruned ${deleted_count} old GHCR package version(s)."

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ env.REPO_LC }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-questarr-${{ env.VERSION }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-questarr-${{ env.VERSION }}-${{ env.ENVIRONMENT }}
          path: sbom-questarr-${{ env.VERSION }}.spdx.json
          retention-days: 90

      - name: Deployment summary
        id: summary
        run: |
          TAG="latest"
          if [ "${{ env.ENVIRONMENT }}" == "dev" ]; then
            TAG="dev"
          fi

          SUMMARY=$(cat << EOF
          ## Deployment Summary

          - **Environment:** ${{ env.ENVIRONMENT }}
          - **Image:** ghcr.io/${{ env.REPO_LC }}
          - **Docker Hub:** doezer/${{ env.REPO_NAME_LC }}
          - **Tags:** ${{ steps.meta.outputs.tags }}
          - **SBOM:** attached to the image as an attestation, and uploaded as the \`sbom-questarr-${{ env.VERSION }}-${{ env.ENVIRONMENT }}\` workflow artifact

          ### Pull and run the image:
          \`\`\`bash
          docker pull ghcr.io/${{ env.REPO_LC }}:\$TAG
          docker run -d -p 5000:5000 \\
            -e POSTGRES_PASSWORD=your_password \\
            -e IGDB_CLIENT_ID=your_client_id \\
            -e IGDB_CLIENT_SECRET=your_client_secret \\
            ghcr.io/${{ env.REPO_LC }}:\$TAG
          \`\`\`

          ### Inspect the SBOM attestation:
          \`\`\`bash
          docker buildx imagetools inspect ghcr.io/${{ env.REPO_LC }}:\$TAG --format '{{ json (index .SBOM "linux/amd64").SPDX }}'
          \`\`\`
          EOF
          )

          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post result to PR
        if: always() && inputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ inputs.repository }}
          comment-id: ${{ inputs.comment-id }}
          body: ${{ steps.summary.outputs.content }}

  # Optional extra build target, mirroring how ARM64 is an opt-in extra
  # platform for build-and-push above: this never runs unless explicitly
  # requested via workflow_dispatch. Unlike ARM64 (which production Docker
  # builds always turn on, since published images need to run on ARM SBCs),
  # there's no equivalent "production always needs this" case for a Windows
  # desktop/server installer, so this only runs when build_windows_installer
  # is explicitly set to true on a manual dispatch.
  windows-installer:
    runs-on: windows-latest
    needs: sca-gate
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_installer == true
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: "npm"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Publish Windows service host
        shell: pwsh
        run: |
          dotnet publish installer/windows/Questarr.Service/Questarr.Service.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            --output release/service

      - name: Prune development dependencies
        run: npm prune --omit=dev

      # 7zip-bin (used for mod/archive extraction) ships prebuilt 7za
      # binaries for every OS/arch it supports; only linux/win-x64 is
      # relevant to a Windows install, so drop the rest to keep the
      # installer lean. Defensive: no-ops if the package or its layout
      # isn't what's expected, rather than failing the build.
      - name: Strip non-Windows-x64 7zip-bin binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "node_modules/7zip-bin"
          if (-not (Test-Path $root)) {
            Write-Host "7zip-bin not present; nothing to strip."
            return
          }

          foreach ($platform in @("mac", "linux")) {
            $dir = Join-Path $root $platform
            if (Test-Path $dir) {
              Remove-Item -Recurse -Force $dir
            }
          }

          $winDir = Join-Path $root "win"
          if (Test-Path $winDir) {
            Get-ChildItem -LiteralPath $winDir -Directory |
              Where-Object { $_.Name -ne "x64" } |
              Remove-Item -Recurse -Force

            if (-not (Test-Path (Join-Path $winDir "x64"))) {
              throw "Expected 7zip-bin/win/x64 to remain after pruning"
            }
          }

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageJson = Get-Content package.json | ConvertFrom-Json
          $version = $packageJson.version
          $artifact = "QuestarrSetup-$version-windows-x64.exe"

          Write-Host "Resolved Windows installer version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payloadRoot = Join-Path "release" "payload"
          $binDir = Join-Path $payloadRoot "bin"

          New-Item -ItemType Directory -Force -Path $payloadRoot, $binDir | Out-Null
          # dist/ already contains the compiled server AND compiled shared/
          # code (tsconfig.build.json builds server/** and shared/** into a
          # single dist/ tree), so shared/ does not need to be copied
          # separately the way the Dockerfile does defensively.
          Copy-Item -Path dist, migrations, node_modules -Destination $payloadRoot -Recurse
          Copy-Item -Path package.json, package-lock.json, README.md, COPYING -Destination $payloadRoot
          Copy-Item -Path installer/windows/README.txt -Destination (Join-Path $payloadRoot "README-WINDOWS.txt")
          Copy-Item -Path release/service/Questarr.Service.exe -Destination (Join-Path $payloadRoot "Questarr.Service.exe")

          if (Test-Path docs) {
            Copy-Item -Path docs -Destination $payloadRoot -Recurse
          }

          $nodePath = (Get-Command node).Source
          Copy-Item -Path $nodePath -Destination (Join-Path $binDir "node.exe")

          $payloadRootPath = (Get-Item -LiteralPath $payloadRoot).FullName
          $manifestPath = Join-Path $payloadRootPath "questarr-install-manifest.json"
          $includePath = Join-Path "release" "questarr-files.iss"

          function ConvertTo-InnoString {
            param([Parameter(Mandatory = $true)][string] $Value)
            return $Value.Replace('"', '""')
          }

          function ConvertTo-InnoSingleQuotedString {
            param([Parameter(Mandatory = $true)][string] $Value)
            return $Value.Replace("'", "''")
          }

          $payloadRootPrefix = $payloadRootPath.TrimEnd('\') + '\'
          $payloadFiles = Get-ChildItem -LiteralPath $payloadRootPath -Recurse -File |
            Where-Object { $_.FullName -ne $manifestPath } |
            Sort-Object FullName

          $manifestFiles = foreach ($file in $payloadFiles) {
            if (-not $file.FullName.StartsWith($payloadRootPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Payload file is outside the payload root: $($file.FullName)"
            }

            $relativePath = $file.FullName.Substring($payloadRootPrefix.Length).Replace('\', '/')
            [ordered]@{
              path = $relativePath
              size = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          [ordered]@{
            version = "${{ steps.meta.outputs.version }}"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            files = @($manifestFiles)
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $manifestPath -Encoding utf8

          $includeLines = foreach ($entry in $manifestFiles) {
            $relativeWindowsPath = $entry.path.Replace('/', '\')
            $sourcePath = Join-Path $payloadRootPath $relativeWindowsPath
            $relativeDir = Split-Path $relativeWindowsPath -Parent
            $destDir = if ([string]::IsNullOrWhiteSpace($relativeDir)) {
              "{app}"
            } else {
              "{app}\$relativeDir"
            }

            'Source: "' + (ConvertTo-InnoString $sourcePath) + '"; DestDir: "' + (ConvertTo-InnoString $destDir) + '"; Flags: ignoreversion; Check: ShouldInstallPayloadFile(''' + (ConvertTo-InnoSingleQuotedString $entry.path) + ''')'
          }

          $includeLines | Set-Content -LiteralPath $includePath -Encoding utf8
          if (Select-String -LiteralPath $includePath -Pattern "createallsubdirs" -Quiet) {
            throw "Generated Inno file list must not use createallsubdirs for per-file entries"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerOutput = Join-Path "release" "installer"
          New-Item -ItemType Directory -Force -Path $installerOutput | Out-Null

          $env:QUESTARR_VERSION = "${{ steps.meta.outputs.version }}"
          $env:QUESTARR_SOURCE_DIR = (Resolve-Path (Join-Path "release" "payload")).Path
          $env:QUESTARR_OUTPUT_DIR = (Resolve-Path $installerOutput).Path
          $env:QUESTARR_FILES_INCLUDE = (Resolve-Path (Join-Path "release" "questarr-files.iss")).Path

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc installer/windows/Questarr.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Validate installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = Join-Path "release/installer" "${{ steps.meta.outputs.artifact }}"
          if (-not (Test-Path $installerPath)) {
            throw "Missing installer: $installerPath"
          }

          $installer = Get-Item $installerPath
          if ($installer.Length -lt 10MB) {
            throw "Installer looks too small: $($installer.Length) bytes"
          }
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ascii

          $requiredPaths = @(
            "release/payload/bin/node.exe",
            "release/payload/Questarr.Service.exe",
            "release/payload/dist/server/index.js",
            "release/payload/migrations/meta/_journal.json",
            "release/payload/node_modules/better-sqlite3",
            "release/payload/README-WINDOWS.txt",
            "release/payload/questarr-install-manifest.json",
            "release/questarr-files.iss"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Missing installer payload file: $path"
            }
          }

          & release/payload/bin/node.exe --check release/payload/dist/server/index.js

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuestarrSetup-${{ steps.meta.outputs.version }}-windows-x64
          path: |
            release/installer/${{ steps.meta.outputs.artifact }}
            release/installer/${{ steps.meta.outputs.artifact }}.sha256
          if-no-files-found: error

      # Best-effort: attach the installer to the matching GitHub Release when
      # one was requested and already exists. This deliberately never fails
      # the job - workflow_dispatch can be run with no tag at all (there's
      # then nothing to attach to), and even with a tag, release.yml may not
      # have created that release yet (or never will, for an ad-hoc
      # dispatch). `gh release view` tells us which case we're in; only
      # `gh release upload` runs when it confirms the release exists, so a
      # missing release is a logged no-op rather than a failure.
      - name: Attach installer to matching GitHub release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = Join-Path "release/installer" "${{ steps.meta.outputs.artifact }}"
          $checksumPath = "$installerPath.sha256"

          gh release view $env:RELEASE_TAG --repo ${{ github.repository }} | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No GitHub release found for tag '$env:RELEASE_TAG'; skipping installer attachment (this is not an error - the release may not exist yet, or this run had no matching release to attach to)."
            exit 0
          }

          gh release upload $env:RELEASE_TAG $installerPath $checksumPath --repo ${{ github.repository }} --clobber

      - name: Windows installer summary
        shell: pwsh
        env:
          # Routed through env rather than interpolated directly into the
          # script body, since inputs.tag is arbitrary user-supplied text at
          # workflow_dispatch time (same reasoning as the release-attachment
          # step above).
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $releaseNote = if ([string]::IsNullOrEmpty($env:RELEASE_TAG)) {
            "skipped - no tag input was provided"
          } else {
            "attempted for tag $($env:RELEASE_TAG) (no-op if that release does not exist)"
          }

          $SUMMARY = @"
          ## Windows Installer

          - **Artifact:** ${{ steps.meta.outputs.artifact }} (+ matching .sha256)
          - **Version:** ${{ steps.meta.outputs.version }}
          - **Download:** workflow artifact ``QuestarrSetup-${{ steps.meta.outputs.version }}-windows-x64`` on this run
          - **Release attachment:** $releaseNote
          "@

          $SUMMARY | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
