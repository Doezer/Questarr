{{- if (include "questarr.hasInlineSecrets" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "questarr.fullname" . }}
  labels:
    {{- include "questarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $root := . }}
  {{- range $name, $value := .Values.questarr.secrets }}
  {{- if $value }}
  {{ include "questarr.secretKeyFor" (dict "root" $root "name" $name) }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
